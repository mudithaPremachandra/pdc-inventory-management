

[project]
name = "inventory"
version = "1.0.0"
description = "Inventory management system built with CQRS + Event Sourcing"
requires-python = ">=3.11"

[project.scripts]
inventory = "inventory.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs a running PostgreSQL (DATABASE_URL)",
    "e2e: drives the whole system through the HTTP APIs and the CLI",
]
